name: CI

# PR gate: PHPCS, PHPUnit, and Plugin Check run on ubuntu-24.04 via wp-env.
# E2E tests run only on release/* branches — see pre-release.yml.

# PR gate only. main is deliberately absent: on this repository main advances
# solely by merging a release PR, and release-artifact.yml re-runs these same
# checks against the built artifact before it publishes anything. Running them
# again on the push would be a third execution of a tree already tested twice.
on:
  pull_request:
    branches: [main, 'feature/**', 'fix/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: PHPCS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint:php

  unit:
    name: PHPUnit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:unit:php

  check-plugin:
    name: Plugin Check (PCP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build distributable zip
        run: npm run build:zip
      - name: Run Plugin Check suite
        run: npm run plugin-check
      - name: Post Plugin Check results as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: builds/plugin-check-results.txt
      - name: Upload Plugin Check results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-check-results
          path: builds/plugin-check-results.txt
          retention-days: 7
