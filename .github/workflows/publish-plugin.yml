name: Publish Plugin

# Ships a tagged release to the plugin's WordPress.org SVN repository. Dispatch it
# manually against a v<version> tag — the tags created by release-artifact.yml on
# merge to main. Nothing here runs automatically.
#
# This workflow is authored in the private repo at .github/public/workflows/ and
# mirrored here by release-mirror.yml. It is not dispatchable from the private
# repo: GitHub only recognises workflows under .github/workflows/.
#
# Scope: shared scaffolding only — guards, payload staging and dry-run
# reporting. It performs NO SVN write. The stable lane (trunk + tag) and the
# pre-release lane (tag only) land separately, as does asset sync.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish — defaults to package.json at the tag, and must match it. x.y.z, or a pre-release x.y.z-beta1 / x.y.z-rc1'
        required: false
        type: string
      dry_run:
        description: 'Report what would be published and make no SVN change'
        required: false
        default: true
        type: boolean
      sync_assets:
        description: 'Also sync .wordpress-org/ to SVN assets/ (not implemented yet)'
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-plugin
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Must match the approved WordPress.org plugin slug.
  SLUG: airo-wp
  SVN_ROOT: https://plugins.svn.wordpress.org

jobs:
  # sync_assets means "artwork only, no code release", so the two jobs are
  # mutually exclusive by construction.
  publish:
    name: Publish to WordPress.org
    if: inputs.sync_assets != true
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      # Whether WordPress.org actually holds the release, verified against the remote
      # rather than inferred from svn's exit code. See the verify step for why.
      published: ${{ steps.verify.outputs.published }}

    steps:
      # Publishing is only ever done from a version tag, never a branch. A branch
      # moves: dispatching from release/* could publish commits pushed after CI went
      # green. A tag cannot, so what is published is exactly what was tested, and a
      # re-run republishes byte-identical content. Tags are created by
      # release-artifact.yml on merge to main.
      #
      # Fail before doing any work, rather than after building an artifact nobody
      # will use.
      - name: Guard - dispatch ref must be a version tag
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "::error::Refusing to publish from '${GITHUB_REF}'. Dispatch this workflow with a v<version> tag as the ref (for example --ref v0.3.4)."
            exit 1
          fi
          echo "Ref: ${GITHUB_REF}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          PKG_VERSION=$(node -p "require('./package.json').version")

          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${PKG_VERSION}"
          fi

          # Accept a stable x.y.z or a pre-release x.y.z-<suffix> (beta1, rc1).
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Version '${VERSION}' is not x.y.z or x.y.z-<pre-release>."
            exit 1
          fi

          # An explicit input that disagrees with package.json means the branch and
          # the request are out of step; publishing either one would be a guess.
          if [ "${VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Requested version '${VERSION}' does not match package.json ('${PKG_VERSION}')."
            exit 1
          fi

          # The dispatch ref is a tag (enforced above), so its name is another
          # independent claim about which version this is. If it disagrees with
          # package.json, the tag was cut at the wrong commit — publishing either
          # answer would be a guess, and wp.org tags are effectively permanent.
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match version '${VERSION}' from package.json. Expected tag 'v${VERSION}'."
            exit 1
          fi

          if printf '%s' "${VERSION}" | grep -q -- '-'; then
            CHANNEL=pre-release
          else
            CHANNEL=stable
          fi

          echo "version=${VERSION}"   >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}"   >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION} (${CHANNEL})"

      # SVN existence checks over HTTP, so this job needs no svn client and has
      # no means of writing to WordPress.org.
      - name: Guard - slug provisioned and tag not already published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          PLUGIN_URL="${SVN_ROOT}/${SLUG}/"
          TAG_URL="${SVN_ROOT}/${SLUG}/tags/${VERSION}/"

          plugin_status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${PLUGIN_URL}")
          if [ "${plugin_status}" != "200" ]; then
            echo "::error::${PLUGIN_URL} returned ${plugin_status}. The '${SLUG}' slug does not look provisioned on WordPress.org."
            exit 1
          fi

          tag_status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${TAG_URL}")
          if [ "${tag_status}" = "200" ]; then
            echo "::error::${TAG_URL} already exists. WordPress.org tags are effectively permanent - bump the version instead of republishing."
            exit 1
          fi
          if [ "${tag_status}" != "404" ]; then
            echo "::error::Unexpected status ${tag_status} for ${TAG_URL}. Refusing to continue on an ambiguous answer."
            exit 1
          fi

          echo "Slug provisioned; tags/${VERSION} is free."

      # Runs BEFORE the build, because everything after it takes ~8 minutes and the
      # credentials are not exercised until the very last step (the commit). Two
      # failed publishes of v0.3.5 each burned a full build to discover a bad secret.
      #
      # What this CANNOT do: verify the credentials actually authenticate. WordPress.org
      # permits anonymous read, so an authenticated read is not a test — passing
      # deliberately invalid credentials to `svn info` against the plugin repository
      # returns exit 0 and full repository metadata, because the server never issues a
      # challenge. Only `svn commit` authenticates, and there is no dry-run commit. The
      # obvious alternatives are worse: `svn lock` mutates shared lock state, and
      # provoking an authenticated failure via a doomed `svn mkdir` risks a real commit
      # if the server validates auth before the path. So this step deliberately checks
      # only what it can check for certain, rather than shipping a probe that reports
      # success on credentials that cannot commit.
      #
      # What it does check is the class of mistake that actually occurs: a secret that
      # is empty, carries pasted whitespace, or holds an email address.
      - name: Pre-flight - SVN credential shape
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ "${DRY_RUN}" != "false" ]; then
            echo "::notice::Dry run: credentials are NOT validated by this workflow. WordPress.org allows anonymous read, so the SVN checkout below succeeds without them. Only a real publish exercises authentication."
          fi

          fail=0

          if [ -z "${SVN_USERNAME:-}" ]; then
            echo "::error::SVN_USERNAME is not set. Add it as a repository secret."
            fail=1
          fi
          if [ -z "${SVN_PASSWORD:-}" ]; then
            echo "::error::SVN_PASSWORD is not set. Add it as a repository secret."
            fail=1
          fi
          [ "${fail}" -eq 0 ] || exit 1

          # A pasted trailing newline or stray space is a common and very confusing
          # cause of E215004, because nothing in the log reveals it.
          for pair in "SVN_USERNAME:${SVN_USERNAME}" "SVN_PASSWORD:${SVN_PASSWORD}"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            trimmed=$(printf '%s' "${value}" | tr -d '[:space:]')
            if [ "${#value}" -ne "${#trimmed}" ]; then
              echo "::error::${name} contains whitespace. Re-add the secret with no leading or trailing spaces or newline."
              fail=1
            fi
          done

          case "${SVN_USERNAME}" in
            *@*)
              echo "::error::SVN_USERNAME looks like an email address. WordPress.org SVN wants the account username, not the email."
              fail=1
              ;;
          esac

          [ "${fail}" -eq 0 ] || exit 1

          echo "Credential shape OK (not an authentication test - see the comment above this step)."

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The zip is the canonical artifact: built from package.json "files", and
      # the same one the pre-release workflow runs Plugin Check and the e2e
      # matrix against.
      - name: Build distributable zip
        run: npm run build:zip

      - name: Stage SVN payload
        id: payload
        run: bash .github/scripts/stage-svn-payload.sh builds/airo-wp.zip builds/svn-payload

      # deploy.sh evaluates its dry-run input as a shell command (`if $INPUT_DRY_RUN`),
      # so it must receive exactly `true` or `false`. Normalise here: anything that
      # is not an unambiguous `false` becomes `true`, i.e. the safe direction. This
      # is what keeps the destructive path fail-closed now that the deploy step
      # runs on dry runs too.
      - name: Normalise dry-run flag
        id: flags
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "false" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "Dry run: false - this run WILL commit to WordPress.org."
          else
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "Dry run: true - nothing will be committed."
          fi

      # A stable release must declare itself stable. The deploy rsyncs the payload
      # over trunk, so it is the PAYLOAD's readme that ends up as trunk/readme.txt
      # and therefore decides what WordPress.org serves — checking the remote
      # trunk's current value would inspect state we are about to overwrite.
      #
      # Stable only: a pre-release deliberately leaves Stable tag pointing at the
      # previous stable release, so this must not run on that channel.
      - name: Guard - stable release must declare itself stable
        if: steps.version.outputs.channel == 'stable'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PAYLOAD: ${{ steps.payload.outputs.payload }}
        run: |
          set -euo pipefail

          readme="${PAYLOAD}/readme.txt"

          if [ ! -f "${readme}" ]; then
            echo "::error::${readme} is missing from the staged payload."
            exit 1
          fi

          stable_tag=$(sed -n 's/^Stable tag:[[:space:]]*\([^[:space:]]*\).*/\1/p' "${readme}" | head -1)

          if [ -z "${stable_tag}" ]; then
            echo "::error::No 'Stable tag' header found in the payload's readme.txt."
            exit 1
          fi

          if [ "${stable_tag}" != "${VERSION}" ]; then
            echo "::error::Payload readme.txt declares 'Stable tag: ${stable_tag}' but this run publishes ${VERSION}. WordPress.org serves whatever Stable tag names, so this would publish ${VERSION} and then keep serving ${stable_tag}."
            exit 1
          fi

          echo "Payload declares Stable tag: ${stable_tag}"

      - name: Report what would be published
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          PAYLOAD: ${{ steps.payload.outputs.payload }}
          DRY_RUN: ${{ inputs.dry_run }}
          SYNC_ASSETS: ${{ inputs.sync_assets }}
        run: |
          set -euo pipefail

          {
            echo "### Publish plan"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Channel | ${CHANNEL} |"
            echo "| Slug | \`${SLUG}\` |"
            echo "| SVN tag | \`${SVN_ROOT}/${SLUG}/tags/${VERSION}\` |"
            if [ "${CHANNEL}" = "stable" ]; then
              echo "| SVN trunk | \`${SVN_ROOT}/${SLUG}/trunk\` (would be updated) |"
            else
              echo "| SVN trunk | not touched (pre-release) |"
            fi
            echo "| Dry run | ${DRY_RUN} |"
            echo "| Sync assets | after a successful stable deploy |"
            echo
            echo "<details><summary>Payload manifest</summary>"
            echo
            echo '```'
            ( cd "${PAYLOAD}" && find . -type f | sed 's|^\./||' | sort )
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          # Informational only. An empty trunk (404) is the expected state before
          # the first release, so this must not gate anything.
          trunk_readme=$(curl -s --max-time 30 "${SVN_ROOT}/${SLUG}/trunk/readme.txt" || true)
          current=$(printf '%s' "${trunk_readme}" | sed -n 's/^Stable tag:[[:space:]]*\([^[:space:]]*\).*/\1/p' | head -1)
          echo "Current trunk Stable tag: ${current:-none (trunk is empty)}"

          echo "Target tag: ${SVN_ROOT}/${SLUG}/tags/${VERSION}"
          echo "Payload:    ${PAYLOAD}"
          echo "Manifest written to the job summary."

      # On a dry run this archive is the thing worth inspecting: it is exactly
      # what would be committed to WordPress.org.
      - name: Upload distributable zip
        uses: actions/upload-artifact@v4
        with:
          name: airo-wp-${{ steps.version.outputs.version }}
          path: builds/airo-wp.zip
          retention-days: 7

      # Stable lane: rsync the payload into trunk and copy trunk to tags/X.Y.Z.
      #
      # Runs on dry runs too, deliberately: with dry-run the action still performs
      # the SVN checkout and rsync and prints `svn status`, so a dry run shows the
      # exact remote diff. Only the single `svn commit` is skipped, so nothing is
      # written. The flag is normalised above rather than passed through raw.
      #
      # ASSETS_DIR is pointed at a path that does not exist on purpose. It defaults
      # to `.wordpress-org`, which this repo now has, so leaving it unset would make
      # every stable deploy publish plugin-directory artwork as a side effect —
      # bypassing the sync_assets input entirely. Asset syncing is owned by its own
      # lane; deploy.sh logs "No assets directory found" and leaves SVN assets/
      # untouched.
      - name: Publish stable release to WordPress.org
        id: deploy
        # continue-on-error so the verify step below can have the final word: a
        # client-side error over a landed commit must not end the job here.
        continue-on-error: true
        if: steps.version.outputs.channel == 'stable'
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: ${{ steps.flags.outputs.dry_run }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ env.SLUG }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: ${{ steps.payload.outputs.payload }}
          ASSETS_DIR: .no-assets-managed-by-asset-lane

      # Subversion is NOT preinstalled on GitHub-hosted runners (it is absent from
      # the ubuntu-24.04 image manifest). The stable lane gets it for free because
      # 10up's deploy.sh installs it; this lane shells out to svn directly, so it
      # has to provision it itself.
      - name: Install Subversion
        if: steps.version.outputs.channel != 'stable'
        run: |
          set -euo pipefail
          if ! command -v svn >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends subversion
          fi
          svn --version --quiet

      # Pre-release lane: import straight into tags/<version>, never touching
      # trunk. The script asserts trunk is byte-identical afterwards and honours
      # the normalised dry-run flag itself, since `svn import` has no dry-run mode.
      - name: Publish pre-release tag to WordPress.org
        id: deploy_pre
        continue-on-error: true
        if: steps.version.outputs.channel != 'stable'
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          PAYLOAD: ${{ steps.payload.outputs.payload }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ steps.flags.outputs.dry_run }}
        run: |
          bash .github/scripts/svn-import-tag.sh \
            "${PAYLOAD}" "${SVN_ROOT}" "${SLUG}" "${VERSION}" "${DRY_RUN}"

      # The deploy step's exit code is not a reliable answer to "did this publish?".
      # WordPress.org's SVN server can complete a commit and then fail to finalise it
      # client-side. On the first real publish of this plugin (v0.3.5) that produced a
      # red run over a fully successful release:
      #
      #   13:47:09  Committing files...        (one commit: trunk + tag copy)
      #   13:48:52  Committing transaction...
      #   13:56:43  svn: E000002: Can't open file '.../3676222-2abau.txn/props'
      #
      # Eight minutes passed before the server failed to read its own transaction
      # directory; on a ~1,100-file, ~11 MB commit it had been reaped or completed
      # asynchronously. trunk/ and tags/0.3.5/ were 404 before that run and complete
      # after it. The publish had landed.
      #
      # The cost was not just a misleading red mark: sync-assets is gated on this job's
      # result, so the artwork was silently skipped and the plugin page went live
      # unbranded. So ask the registry instead of trusting the client, and let this
      # verdict — not the exit code — drive the asset lane.
      #
      # always() so this runs after a failed deploy, which is the whole point.
      - name: Verify the release actually reached WordPress.org
        id: verify
        if: always() && steps.payload.outcome == 'success'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          DRY_RUN: ${{ steps.flags.outputs.dry_run }}
        run: |
          set -euo pipefail

          if [ "${DRY_RUN}" != "false" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Dry run - nothing was published, so there is nothing to verify."
            exit 0
          fi

          tag_status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${SVN_ROOT}/${SLUG}/tags/${VERSION}/")

          ok=1
          [ "${tag_status}" = "200" ] || ok=0

          # A stable release must also have replaced trunk, and trunk's readme is what
          # WordPress.org actually serves - so check the value, not just presence.
          if [ "${CHANNEL}" = "stable" ]; then
            trunk_readme=$(curl -s --max-time 30 "${SVN_ROOT}/${SLUG}/trunk/readme.txt" || true)
            trunk_stable=$(printf '%s' "${trunk_readme}" | sed -n 's/^Stable tag:[[:space:]]*\([^[:space:]]*\).*/\1/p' | head -1)
            [ "${trunk_stable}" = "${VERSION}" ] || ok=0
            echo "trunk Stable tag: ${trunk_stable:-<none>} (expected ${VERSION})"
          fi

          echo "tags/${VERSION}: HTTP ${tag_status}"

          if [ "${ok}" -eq 1 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "WordPress.org holds ${VERSION}."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "WordPress.org does NOT hold ${VERSION}."
          fi

      # Reconcile the two answers. A verified remote overrides a client-side error,
      # because the registry is the authority on what was published. The converse also
      # holds: a green deploy that did not actually land must not pass silently.
      - name: Reconcile deploy result with remote state
        if: always() && steps.verify.conclusion == 'success' && steps.flags.outputs.dry_run == 'false'
        env:
          # Exactly one lane runs; the other reports 'skipped'.
          DEPLOY: ${{ steps.version.outputs.channel == 'stable' && steps.deploy.outcome || steps.deploy_pre.outcome }}
          PUBLISHED: ${{ steps.verify.outputs.published }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [ "${PUBLISHED}" = "true" ] && [ "${DEPLOY}" != "success" ]; then
            echo "::warning::The Subversion client reported '${DEPLOY}', but WordPress.org holds ${VERSION}. Treating this as a successful publish. This is the known WordPress.org transaction-finalise race on large commits - do NOT re-publish; the tag guard would refuse anyway."
            {
              echo "### Publish succeeded despite a client-side error"
              echo
              echo "\`svn\` reported \`${DEPLOY}\`, but \`tags/${VERSION}\` is present on"
              echo "WordPress.org and \`trunk\` declares the right \`Stable tag\`. The commit landed and"
              echo "the client failed afterwards - the known transaction-finalise race on large commits."
              echo
              echo "**Do not re-publish.** The release is live."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${PUBLISHED}" != "true" ] && [ "${DEPLOY}" = "success" ]; then
            echo "::error::The Subversion client reported success, but WordPress.org does not hold ${VERSION}. Refusing to report a publish that cannot be confirmed."
            exit 1
          fi

          if [ "${PUBLISHED}" != "true" ]; then
            echo "::error::Publish failed and WordPress.org does not hold ${VERSION}."
            exit 1
          fi

          echo "Deploy and remote state agree: ${VERSION} is published."

      # 10up's action surfaces svn's raw error and nothing else. E215004 is a bare
      # credential rejection whose real causes are not guessable from the message, and
      # all three below cost real time on the first release of this plugin.
      - name: Explain a stable-lane authentication failure
        # Keyed to the reconciled verdict, not raw failure(): a client-side error over a
        # landed commit is a successful publish (see the verify step), and must not be
        # reported as a credential problem.
        if: always() && steps.version.outputs.channel == 'stable'
          && steps.deploy.outcome == 'failure'
          && steps.verify.outputs.published != 'true'
        run: |
          {
            echo "### Publish failed"
            echo
            echo "If the log shows \`svn: E215004\` the credentials were rejected. Check, in order:"
            echo
            echo "1. **\`SVN_PASSWORD\` must be an SVN-specific password**, not the account login password."
            echo "   Generate one at wordpress.org profile -> Account & Security -> SVN credentials ->"
            echo "   Generate Password. WordPress.org is migrating all accounts off login passwords for"
            echo "   SVN, and once an SVN password has been generated the account password stops working"
            echo "   for SVN permanently."
            echo "2. **\`SVN_USERNAME\` capitalisation is significant** for SVN, even though it is not for"
            echo "   wordpress.org login."
            echo "3. **The account must be a committer on this plugin.** Lacking that presents as an"
            echo "   authentication failure, not a permissions error."
            echo
            echo "A dry run cannot catch any of these: WordPress.org allows anonymous read, so the"
            echo "dry-run checkout succeeds without ever using the credentials."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::SVN publish failed. See the job summary for the likely causes of an E215004 credential rejection."

  # Runs either standalone (sync_assets, no code release) or after a successful
  # stable deploy. Never for a pre-release: SVN assets/ is version-independent and
  # goes live immediately, so a beta must not change what the plugin page shows
  # while the released version is still the previous one.
  #
  # `needs` plus `always()` is what allows both entry points: on a standalone run
  # the publish job is skipped, and this still proceeds.
  sync-assets:
    name: Sync plugin-directory assets
    needs: publish
    if: |
      always() && (
        inputs.sync_assets == true ||
        (needs.publish.outputs.published == 'true' && needs.publish.outputs.channel == 'stable')
      )
    runs-on: ubuntu-24.04

    steps:
      - name: Guard - dispatch ref must be a version tag
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "::error::Refusing to sync assets from '${GITHUB_REF}'. Dispatch this workflow with a v<version> tag as the ref."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      # Job-scoped: a standalone run skips the publish job, so its normalised flag
      # is not available here. Same fail-closed rule.
      - name: Normalise dry-run flag
        id: flags
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "false" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to publish placeholder artwork
        env:
          DRY_RUN: ${{ steps.flags.outputs.dry_run }}
        run: |
          set -euo pipefail
          marker=.github/ASSETS_ARE_PLACEHOLDERS

          if [ ! -f "${marker}" ]; then
            echo "No placeholder marker present; artwork is treated as real."
            exit 0
          fi

          if [ "${DRY_RUN}" = "false" ]; then
            echo "::error::${marker} exists, so .wordpress-org/ still holds placeholder images. Publishing them would put them on the live plugin page immediately. Replace the artwork and delete that file first."
            exit 1
          fi

          echo "::warning::Placeholder artwork detected (${marker}); continuing because this is a dry run."

      - name: Install Subversion
        run: |
          set -euo pipefail
          if ! command -v svn >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends subversion
          fi
          svn --version --quiet

      - name: Sync assets to WordPress.org
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          DRY_RUN: ${{ steps.flags.outputs.dry_run }}
        run: |
          bash .github/scripts/svn-sync-assets.sh \
            .wordpress-org "${SVN_ROOT}" "${SLUG}" "${DRY_RUN}"
